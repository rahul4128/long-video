name: One-time Ancient Science Playlist Repair

on:
  push:
    branches: [visual-director-v2]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Ancient India Science playlist routing') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-director-v2
          fetch-depth: 1
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/youtube_pack.py')
          s = p.read_text(encoding='utf-8')
          old = 'elif has("प्राचीन भारत का विज्ञान", "प्राचीन विज्ञान", "मंदिर इंजीनियरिंग", "temple engineering", "ancient india science", "ancient temple engineering", "मंदिर की ध्वनि", "acoustics", "architectural science"):'
          new = 'elif has("प्राचीन भारत का विज्ञान", "प्राचीन विज्ञान", "प्राचीन मंदिरों", "प्राचीन मंदिर", "मंदिर इंजीनियरिंग", "temple engineering", "ancient india science", "ancient temple engineering", "मंदिर की ध्वनि", "मंदिरों की ध्वनि", "वास्तुकला का विज्ञान", "acoustics", "architectural science"):'
          if old not in s:
              raise SystemExit('Expected playlist-routing line was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m unittest tests.test_instagram_release_caption.SharedShortsReleaseTests.test_ancient_india_science_has_a_separate_playlist
          rm -f .github/workflows/repair-ancient-science-playlist-push.yml
      - name: Commit production fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/youtube_pack.py .github/workflows/repair-ancient-science-playlist-push.yml
          git commit -m "Fix Ancient India Science playlist routing"
          git push origin HEAD:visual-director-v2
