name: Recover Existing Render - QC Only (No Gemini or Remotion)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Prior render GitHub Actions run ID with saved videos, thumbnails and assets'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: existing-render-qc-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  verify-existing-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current corrected QC code
        uses: actions/checkout@v7
        with:
          ref: visual-director-v2

      - name: Validate source-run identifier
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_RUN" =~ ^[0-9]{4,20}$ ]]; then
            echo "::error::Enter a valid numerical GitHub Actions run ID"
            exit 1
          fi

      - name: Retrieve existing approved script, visual assets, final videos and thumbnails
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          # Extract every artifact into an EMPTY directory. GitHub's gh CLI
          # refuses to overwrite files, while checkout already includes
          # public/audio/bgm.mp3. Additionally, the generated-assets archive
          # contains a raw thumbnail.jpg that the final thumbnail artifact
          # deliberately replaces. Never extract overlapping ZIPs in place.
          scratch=$(mktemp -d "$RUNNER_TEMP/existing-render-XXXXXX")
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "generated-assets-$SOURCE_RUN" --dir "$scratch/generated"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "devotional-video-$SOURCE_RUN" --dir "$scratch/long"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "devotional-shorts-$SOURCE_RUN" --dir "$scratch/shorts"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "devotional-thumbnail-$SOURCE_RUN" --dir "$scratch/thumbnail"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "devotional-thumbnail-shorts-$SOURCE_RUN" --dir "$scratch/thumbnail-shorts"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "approved-story-$SOURCE_RUN" --dir "$scratch/story"

          # Validate the staged source material BEFORE overwriting anything.
          for file in \
            generated/public/props.json \
            generated/public/props_shorts.json \
            generated/out/metadata.json \
            long/final_video.mp4 \
            long/audio_master_long.json \
            shorts/final_video_shorts.mp4 \
            shorts/audio_master_shorts.json \
            thumbnail/thumbnail.jpg \
            thumbnail-shorts/thumbnail_shorts_final.jpg \
            story/replay_inputs.json; do
            if [ ! -s "$scratch/$file" ]; then
              echo "::error::Missing saved file: $file from run $SOURCE_RUN"
              exit 1
            fi
          done

          # Overlay ONLY saved media/data paths; never copy source code,
          # workflow definitions, tokens or repository configuration.
          # Source run is authoritative for its generated background audio,
          # props and pre-QC thumbnail. Final rendered artifacts overwrite
          # those raw files in the intended order.
          mkdir -p public out
          rsync -a "$scratch/generated/public/" public/
          rsync -a "$scratch/generated/out/" out/
          rsync -a "$scratch/long/" out/
          rsync -a "$scratch/shorts/" out/
          rsync -a "$scratch/thumbnail/" out/
          rsync -a "$scratch/thumbnail-shorts/" out/
          cp "$scratch/story/replay_inputs.json" out/replay_inputs.json

          # Confirm we are verifying the exact source run's mastered tracks.
          python - <<'PY'
          import json
          from pathlib import Path
          for report_name, input_name in [
              ("audio_master_long.json", "final_video.mp4"),
              ("audio_master_shorts.json", "final_video_shorts.mp4")
          ]:
              report = json.loads((Path("out") / report_name).read_text(encoding="utf-8"))
              if report.get("source") != input_name:
                  raise SystemExit("Unexpected audio-master source identity: " + report_name)
          print("Staged both source-run mastered MP4s and original audio reports.")
          PY
          for path in \
            public/props.json public/props_shorts.json out/metadata.json \
            out/final_video.mp4 out/final_video_shorts.mp4 \
            out/audio_master_long.json out/audio_master_shorts.json \
            out/thumbnail.jpg out/thumbnail_shorts_final.jpg; do
            if [ ! -s "$path" ]; then
              echo "::error::Missing existing artifact: $path"
              exit 1
            fi
          done

      - name: Install FFmpeg for inspection only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Validate real mastered audio in both already-rendered MP4s
        run: python scripts/validate_final_audio.py

      - name: Run full dynamic duration, black-screen, thumbnail and soundtrack QC
        run: python qc.py

      # Preserve source-based editing-style attribution that the old render's
      # skipped publish job could not record. No YouTube upload is attempted.
      - name: Save QC-passed editing style for later factual learning
        if: success()
        continue-on-error: true
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          PIPELINE=$(python -c 'import json; print(json.load(open("out/replay_inputs.json", encoding="utf-8"))["pipeline"])')
          python scripts/render_style_attribution.py \
            --metadata out/metadata.json \
            --editing out/editing_qc_report.json \
            --pipeline "$PIPELINE" \
            --run-id "$SOURCE_RUN"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/render_editing_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record recovered QC-passed editor style from run $SOURCE_RUN"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin visual-director-v2 && git push origin HEAD:visual-director-v2; then
                exit 0
              fi
              sleep 4
            done
            echo "::warning::Verified videos remain available, but editing feedback attribution was not saved."
          fi

      - name: Archive QC findings even if an inspection fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovered-qc-report-${{ inputs.source_run_id }}
          path: |
            out/qc_report.json
            out/audio_master_long.json
            out/audio_master_shorts.json
          if-no-files-found: warn
          retention-days: 14

      - name: Make successfully verified existing videos available for review
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: verified-review-media-${{ inputs.source_run_id }}
          path: |
            out/final_video.mp4
            out/final_video_shorts.mp4
            out/thumbnail.jpg
            out/thumbnail_shorts_final.jpg
            out/metadata.json
            out/audio_master_long.json
            out/audio_master_shorts.json
            out/qc_report.json
            out/music_license_report.json
            out/editing_qc_report.json
            out/visual_qc_report.json
            out/color_continuity_report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summary and explicit publication hold
        if: success()
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          echo "### ✅ Recovery verified without AI calls or any re-render" >> "$GITHUB_STEP_SUMMARY"
          echo "Source render: $SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "Videos and thumbnails retained as private Actions artifacts for manual review." >> "$GITHUB_STEP_SUMMARY"
          echo "No GitHub Release or YouTube upload was created by this workflow." >> "$GITHUB_STEP_SUMMARY"
