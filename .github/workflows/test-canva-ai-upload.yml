name: Test Canva AI Image Upload

on:
  workflow_dispatch:

jobs:
  canva-ai-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CANVA_ACCESS_TOKEN: ${{ secrets.CANVA_ACCESS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CANVA_ACCESS_TOKEN}" || { echo "Missing CANVA_ACCESS_TOKEN"; exit 1; }
          echo "Canva access token is present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Generate real AI scene image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output

          python3 - <<'PY'
          from pathlib import Path
          from generate_assets import generate_ai_image, _valid_generated_image

          path = Path("test-output/ai-scene.png")

          prompt = (
              "Ancient Vishnupad Temple in Gaya, Bihar, sacred Hindu pilgrimage site, "
              "devotees praying, cinematic devotional atmosphere, detailed architecture, "
              "warm divine lighting, 16:9 composition"
          )

          generate_ai_image(
              prompt,
              str(path),
              aspect_ratio="16:9",
              pollinations_width=1280,
              pollinations_height=720,
          )

          ok = _valid_generated_image(str(path))
          print("AI_IMAGE_VALID:", ok)
          print("AI_IMAGE_PATH:", path)

          if not ok:
              raise SystemExit("AI image generation failed or produced an invalid image.")
          PY

      - name: Upload generated image to Canva
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          from pathlib import Path
          import requests

          path = Path("test-output/ai-scene.png")
          token = os.environ["CANVA_ACCESS_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/octet-stream",
              "Asset-Upload-Metadata": json.dumps({
                  "name_base64": base64.b64encode(
                      b"GitHub Canva Real AI Scene"
                  ).decode("ascii")
              }),
          }

          response = requests.post(
              "https://api.canva.com/rest/v1/asset-uploads",
              headers=headers,
              data=path.read_bytes(),
              timeout=120,
          )
          response.raise_for_status()

          job_id = response.json()["job"]["id"]
          print(f"Upload job: {job_id}")

          for attempt in range(1, 31):
              status_response = requests.get(
                  f"https://api.canva.com/rest/v1/asset-uploads/{job_id}",
                  headers={"Authorization": f"Bearer {token}"},
                  timeout=30,
              )
              status_response.raise_for_status()

              job = status_response.json()["job"]
              status = job.get("status")
              print(f"Poll {attempt}/30: {status}")

              if status == "success":
                  asset = job.get("asset", {})
                  print("CANVA_UPLOAD_SUCCESS")
                  print("asset_id:", asset.get("id"))
                  print("asset_type:", asset.get("type"))
                  print("asset_name:", asset.get("name"))
                  break

              if status == "failed":
                  raise RuntimeError(job.get("error", {}))

              time.sleep(3)
          else:
              raise TimeoutError("Canva upload did not finish.")
          PY

      - name: Upload generated image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canva-ai-generated-image
          path: test-output/ai-scene.png
          if-no-files-found: warn
