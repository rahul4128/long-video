name: Test Canva Media Download

on:
  workflow_dispatch:
  push:
    branches:
      - test/canva-playwright

jobs:
  canva-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
          mkdir -p downloads

      - name: Open Canva media page and capture diagnostics
        env:
          CANVA_MEDIA_URL: https://www.canva.com/M/MAHWYOi22z0
        run: |
          cat > canva-download.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";

          const targetUrl = process.env.CANVA_MEDIA_URL;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 }
          });
          const page = await context.newPage();
          const candidates = new Set();
          const resources = [];

          const blocked = (u) => {
            try {
              const host = new URL(u).hostname.toLowerCase();
              return host === "status.canva.com" ||
                     host.endsWith(".status.canva.com") ||
                     host === "cloudflare.com" ||
                     host.endsWith(".cloudflare.com") ||
                     host === "challenges.cloudflare.com" ||
                     host.endsWith(".challenges.cloudflare.com");
            } catch {
              return true;
            }
          };

          page.on("response", (response) => {
            const u = response.url();
            const type = response.headers()["content-type"] || "";
            resources.push({
              url: u,
              status: response.status(),
              contentType: type
            });
            if (!blocked(u) && (type.startsWith("image/") || /\\.(png|jpe?g|webp)(\\?|$)/i.test(u))) {
              candidates.add(u);
            }
          });

          let failed = false;

          try {
            console.log("Opening Canva page:", targetUrl);
            const response = await page.goto(targetUrl, {
              waitUntil: "domcontentloaded",
              timeout: 60000
            });

            const finalUrl = page.url();
            console.log("Initial response:", response?.status(), response?.url());
            console.log("Final page URL:", finalUrl);

            await page.waitForTimeout(3000);

            const imgSources = await page.locator("img").evaluateAll(imgs =>
              imgs.map(i => i.currentSrc || i.src).filter(Boolean)
            );

            for (const src of imgSources) {
              if (!blocked(src)) candidates.add(src);
            }

            const performanceUrls = await page.evaluate(() =>
              performance.getEntriesByType("resource").map(e => e.name)
            );
            for (const u of performanceUrls) {
              if (!blocked(u) && /\\.(png|jpe?g|webp)(\\?|$)/i.test(u)) {
                candidates.add(u);
              }
            }

            await fs.writeFile("downloads/debug-source.html", await page.content());
            await page.screenshot({
              path: "downloads/debug-screenshot.png",
              fullPage: true
            });
            await fs.writeFile(
              "downloads/canva-resources.json",
              JSON.stringify(resources, null, 2)
            );

            console.log("Candidate image URLs:", [...candidates]);

            const finalHost = new URL(finalUrl).hostname.toLowerCase();
            if (
              blocked(finalUrl) ||
              finalHost !== "www.canva.com" ||
              !finalUrl.startsWith("https://www.canva.com/")
            ) {
              throw new Error("Canva page did not remain on an allowed Canva URL; possible block/challenge/redirect.");
            }

            if (candidates.size === 0) {
              throw new Error("No non-blocked Canva image candidates were found.");
            }

            let downloaded = false;
            for (const candidate of candidates) {
              try {
                const res = await page.request.get(candidate, { timeout: 30000 });
                const type = res.headers()["content-type"] || "";
                const body = await res.body();

                if (
                  res.ok() &&
                  type.startsWith("image/") &&
                  body.length > 10000 &&
                  !blocked(candidate)
                ) {
                  const ext = type.includes("png")
                    ? "png"
                    : type.includes("webp")
                      ? "webp"
                      : "jpg";
                  await fs.writeFile(`downloads/canva-test.${ext}`, body);
                  console.log("Downloaded verified Canva candidate:", candidate);
                  console.log("Content-Type:", type);
                  console.log("Bytes:", body.length);
                  downloaded = true;
                  break;
                }
              } catch (e) {
                console.log("Candidate failed:", candidate, e.message);
              }
            }

            if (!downloaded) {
              throw new Error("No verified Canva image could be downloaded.");
            }
          } catch (error) {
            failed = true;
            console.error("TEST FAILED:", error.message);
            process.exitCode = 1;
          } finally {
            try {
              await fs.writeFile(
                "downloads/diagnostic-summary.txt",
                [
                  `targetUrl=${targetUrl}`,
                  `finalUrl=${page.url()}`,
                  `failed=${failed}`,
                  `candidateCount=${candidates.size}`
                ].join("\\n") + "\\n"
              );
            } catch {}
            await browser.close();
          }
          EOF

          node canva-download.mjs

      - name: Validate verified image
        if: success()
        run: |
          file downloads/canva-test.* 
          identify downloads/canva-test.*
          ls -lh downloads/canva-test.*

      - name: Upload Canva diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canva-debug-payload
          path: downloads/
          if-no-files-found: warn
