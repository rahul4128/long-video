name: Test Canva Media Download

on:
  workflow_dispatch:
    inputs:
      design_id:
        description: "Canva Design ID (for example DAHWYLFWoRw)"
        required: true
        type: string
  push:
    branches:
      - test/canva-playwright

jobs:
  canva-rest-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANVA_ACCESS_TOKEN: ${{ secrets.CANVA_ACCESS_TOKEN }}
      CANVA_DESIGN_ID: ${{ github.event.inputs.design_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs and secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CANVA_ACCESS_TOKEN}" || { echo "Missing CANVA_ACCESS_TOKEN GitHub secret."; exit 1; }
          test -n "${CANVA_DESIGN_ID}" || { echo "Missing design_id. Run this workflow with a Canva Design ID."; exit 1; }
          if [[ ! "${CANVA_DESIGN_ID}" =~ ^DA[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid Canva Design ID format: ${CANVA_DESIGN_ID}"
            exit 1
          fi
          echo "Design ID: ${CANVA_DESIGN_ID}"
          echo "Canva access token is present."

      - name: Verify Canva export formats
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request GET \
            --url "https://api.canva.com/rest/v1/designs/${CANVA_DESIGN_ID}/export-formats" \
            --header "Authorization: Bearer ${CANVA_ACCESS_TOKEN}")"

          if [[ "${http_code}" != "200" ]]; then
            echo "Canva export-formats request failed with HTTP ${http_code}"
            cat "${response_file}"
            exit 1
          fi

          echo "Canva API access confirmed."
          jq '.formats' "${response_file}"

          if [[ "$(jq -r '.formats.png // empty' "${response_file}")" == "" ]]; then
            echo "PNG is not available for this Canva design."
            exit 1
          fi

      - name: Start Canva PNG export
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"

          payload="$(jq -n --arg design_id "${CANVA_DESIGN_ID}" '{design_id: $design_id, format: {type: "png"}}')"

          http_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "https://api.canva.com/rest/v1/exports" \
            --header "Authorization: Bearer ${CANVA_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${payload}")"

          if [[ "${http_code}" != "200" ]]; then
            echo "Canva export creation failed with HTTP ${http_code}"
            cat "${response_file}"
            exit 1
          fi

          export_id="$(jq -r '.job.id // empty' "${response_file}")"
          status="$(jq -r '.job.status // empty' "${response_file}")"

          test -n "${export_id}" || {
            echo "No export job ID returned."
            cat "${response_file}"
            exit 1
          }

          echo "CANVA_EXPORT_ID=${export_id}" >> "${GITHUB_ENV}"
          echo "Initial export status: ${status}"

      - name: Poll Canva export job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads

          for attempt in {1..30}; do
            response_file="$(mktemp)"
            http_code="$(curl --silent --show-error \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request GET \
              --url "https://api.canva.com/rest/v1/exports/${CANVA_EXPORT_ID}" \
              --header "Authorization: Bearer ${CANVA_ACCESS_TOKEN}")"

            if [[ "${http_code}" != "200" ]]; then
              echo "Canva export status request failed with HTTP ${http_code}"
              cat "${response_file}"
              exit 1
            fi

            status="$(jq -r '.job.status // empty' "${response_file}")"
            echo "Poll ${attempt}/30: status=${status}"

            if [[ "${status}" == "success" ]]; then
              export_url="$(jq -r '.job.urls[0] // empty' "${response_file}")"
              test -n "${export_url}" || {
                echo "Export succeeded but no download URL was returned."
                exit 1
              }

              curl --fail --silent --show-error --location "${export_url}" \
                --output downloads/canva-test.png
              echo "Canva PNG downloaded successfully."
              break
            fi

            if [[ "${status}" == "failed" ]]; then
              echo "Canva export job failed:"
              jq '.job.error // .job' "${response_file}"
              exit 1
            fi

            sleep 5
          done

          test -s downloads/canva-test.png || {
            echo "Canva export did not finish within the polling window."
            exit 1
          }

      - name: Validate exported image
        if: success()
        run: |
          set -euo pipefail
          file downloads/canva-test.png
          python3 - <<'PY'
          import struct
          from pathlib import Path

          p = Path("downloads/canva-test.png")
          data = p.read_bytes()

          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Downloaded file is not a valid PNG.")

          width, height = struct.unpack(">II", data[16:24])
          print(f"PNG validated: {width}x{height}, {len(data)} bytes")
          PY
          ls -lh downloads/canva-test.png

      - name: Upload Canva export artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canva-rest-export-test
          path: downloads/canva-test.png
          if-no-files-found: warn
