name: Free CPU-only Preflight (no Make/Gemini)

on:
  push:
    branches:
      - visual-director-v2
      - fix/gemini-tts-model-quota-fallback-20261026
      - fix/portrait-backup-frame-qc-20261026
      - fix/segment-gemini-devotional-shorts-english-20261025
      - codex/episode-voice-consistency-20261023
      - codex/instagram-reels-quality-20261023
    paths:
      - '**.py'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/render.yml'
      - '.github/workflows/ci-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

# New code supersedes earlier CPU-only checks; never cancels video rendering.
concurrency:
  group: cpu-only-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -r requirements.txt pynacl
      - name: Check Python syntax
        run: |
          python -m compileall -q -f generate_assets.py spoken_hindi_qc.py editing_style_engine.py editing_director.py color_continuity.py scripts
      - name: Type-check Remotion scenes and motion graphics (no video render)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify React/Remotion TypeScript compiles
        run: |
          # Story/media JSON is normally generated later by Python. Stubs
          # are used ONLY for type checking; no render uses these assets.
          mkdir -p public
          test -f public/props_shorts.json || cp public/props.json public/props_shorts.json
          test -f public/thumbnail_props.json || printf '%s\n' '{"backgroundImage":"placeholder.jpg","hookText":"परीक्षण"}' > public/thumbnail_props.json
          test -f public/thumbnail_props_shorts.json || printf '%s\n' '{"backgroundImage":"placeholder.jpg","hookText":"परीक्षण"}' > public/thumbnail_props_shorts.json
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Regression checks before media generation
        run: |
          set -euo pipefail
          for file in \
            test_canva_image_provider.py test_canva_token_handoff.py test_gemini_tts.py test_episode_voice.py test_instagram_release_caption.py test_image_framing.py test_music_engine.py test_editing_director.py \
            test_story_visual_relevance.py \
            test_p1_storytelling.py test_preflight_payload.py test_festival_date_gate.py test_festival_timing.py test_editing_performance_learning.py \
            test_render_style_feedback.py test_editing_style_engine.py \
            test_verified_edit_skills.py test_color_continuity.py \
            test_master_final_audio.py test_validate_final_audio.py; do
            python -m unittest discover -s tests -p "$file" -v
          done

          python -m unittest discover -s tests -p 'test_instagram_reel.py' -v
