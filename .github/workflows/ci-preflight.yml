name: Free CPU-only Preflight (no Make/Gemini)

on:
  push:
    branches:
      - visual-director-v2
    paths:
      - '**.py'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/render.yml'
      - '.github/workflows/ci-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -r requirements.txt
      - name: Check Python syntax
        run: |
          python -m compileall -q -f generate_assets.py spoken_hindi_qc.py editing_style_engine.py editing_director.py color_continuity.py scripts
      - name: Type-check Remotion scenes and motion graphics (no video render)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify React/Remotion TypeScript compiles
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Regression checks before media generation
        run: |
          set -euo pipefail
          for file in \
            test_image_framing.py test_music_engine.py test_editing_director.py \
            test_p1_storytelling.py test_preflight_payload.py test_editing_performance_learning.py \
            test_render_style_feedback.py test_editing_style_engine.py \
            test_verified_edit_skills.py test_color_continuity.py \
            test_master_final_audio.py; do
            python -m unittest discover -s tests -p "$file" -v
          done
