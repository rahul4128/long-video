name: Trigger Fixed Render

on:
  push:
    paths:
      - .github/workflows/trigger-fixed-render.yml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch render using previous approved story
        env:
          GH_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run "Render Devotional Video (Long + Shorts)" \
            --repo "$GITHUB_REPOSITORY" \
            --ref visual-director-v2 \
            -f reuse_run_id=41401801372 \
            -f use_canva_images=true \
            -f canva_image_max_per_run=80 \
            -f tts_engine=gemini \
            -f pipeline=canva-updated-flow \
            -f review_approved=false
      - name: Confirm dispatch
        run: echo "Render dispatched after packaging-regression fix using approved story from run 41401801372; Make was not rerun."
