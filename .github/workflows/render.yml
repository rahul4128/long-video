name: Puchu & Pihu - Manual Upload Package
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Complete story JSON from Primary Make
        required: true
        type: string
      pipeline:
        description: Pipeline label
        default: puchu-pihu-manual
        type: string
permissions:
  contents: write
concurrency:
  group: canva-token-rotation
  cancel-in-progress: false
jobs:
  render:
    if: github.ref_name == 'puchu-pihu-manual'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: puchu_pihu/requirements.txt
      - name: Install render and Hindi font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-noto-core
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r puchu_pihu/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: puchu-kokoro-hindi-v1
      - name: Validate story before model loading
        env:
          DISPATCH_PAYLOAD: ${{ inputs.payload }}
        run: python puchu_pihu/render.py --validate-only
      - name: Narrate, animate both formats, and check measured duration
        env:
          DISPATCH_PAYLOAD: ${{ inputs.payload }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
          TOKENIZERS_PARALLELISM: 'false'
        run: python puchu_pihu/render.py
      - name: Optional Canva authentication
        id: canva_auth
        if: success()
        continue-on-error: true
        env:
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          REPO_SECRETS_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python puchu_pihu/refresh_canva_token.py
      - name: Send completed assets to Canva for manual finishing
        if: success()
        continue-on-error: true
        run: python puchu_pihu/canva_finish.py
      - name: Build downloadable ZIP
        if: success()
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          root = Path('puchu-output')
          with zipfile.ZipFile(root / 'manual-upload-package.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in root.iterdir():
                  if p.is_file() and p.suffix in {'.mp4', '.jpg', '.srt', '.json', '.md'}:
                      z.write(p, p.name)
          PY
      - name: Upload finished package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: puchu-pihu-manual-${{ github.run_id }}
          path: puchu-output/manual-upload-package.zip
          retention-days: 30
          if-no-files-found: error
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puchu-pihu-qc-${{ github.run_id }}
          path: |
            puchu-output/*qc.json
            puchu-output/*ffmpeg.log
          retention-days: 7
      - name: Keep successful episode history on this branch
        if: success()
        run: |
          git fetch origin puchu-pihu-manual
          git checkout -B puchu-pihu-manual origin/puchu-pihu-manual
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('puchu-output/story.json').read_text())
          h = Path('puchu_pihu/episodes_history.txt')
          rows = h.read_text().splitlines()
          record = json.dumps({k: p[k] for k in ['episode_id','title','summary','emotion_theme']}, ensure_ascii=False)
          if record not in rows:
              h.write_text('\n'.join((rows + [record])[-60:]) + '\n')
          Path('puchu_pihu/episodes_history.json').write_text(json.dumps({'episodes': h.read_text()}, ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add puchu_pihu/episodes_history.txt puchu_pihu/episodes_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record completed Puchu Pihu episode'
            git push origin HEAD:puchu-pihu-manual
          fi
      - name: Download instructions
        if: success()
        run: |
          echo '## Your manual upload package is ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the puchu-pihu-manual artifact below. Unzip to get long_story.mp4, short_reel.mp4, one thumbnail, Hindi subtitles, and upload copy. Nothing is sent to YouTube or Instagram.' >> "$GITHUB_STEP_SUMMARY"
          cat puchu-output/canva_notes.md >> "$GITHUB_STEP_SUMMARY"
