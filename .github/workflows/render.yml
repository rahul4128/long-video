name: Render Devotional Video (Long + Shorts)

on:
  repository_dispatch:
    types: [trigger-render-long]
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva
          pip install edge-tts requests

      - name: Install Node.js Dependencies
        run: npm install

      - name: Generate Unified Assets (4K B-Roll + FLUX.1 + Voiceover)
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: python generate_assets.py

      - name: Render Video with Remotion
        run: |
          npx remotion render DevotionalComposition out/final_video.mp4 --props=public/props.json --concurrency=2

      - name: Render Shorts Video with Remotion
        run: |
          npx remotion render DevotionalShortsComposition out/final_video_shorts.mp4 --props=public/props_shorts.json --concurrency=2

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devotional-video-${{ github.run_id }}
          path: out/final_video.mp4
          retention-days: 14

      - name: Upload Shorts Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devotional-shorts-${{ github.run_id }}
          path: out/final_video_shorts.mp4
          retention-days: 14
