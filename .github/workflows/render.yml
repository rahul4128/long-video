name: Render Devotional Video (Long + Shorts)

on:
  repository_dispatch:
    types: [trigger-render-long]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # JOB 1: Generate Assets (Pexels Stock + Cloudflare FLUX + Edge-TTS)
  # ---------------------------------------------------------------
  generate-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Generate Unified Assets
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python generate_assets.py

      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: generated-assets-${{ github.run_id }}
          path: |
            public/images
            public/videos
            public/audio
            public/props.json
            public/props_shorts.json
            out/thumbnail.jpg
            out/metadata.json
          retention-days: 1

  # ---------------------------------------------------------------
  # JOB 2: Render Long Video (16:9)
  # ---------------------------------------------------------------
  render-long:
    needs: generate-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Install Node.js Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Install System Dependencies (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva

      - name: Download generated assets
        uses: actions/download-artifact@v4
        with:
          name: generated-assets-${{ github.run_id }}

      - name: Render Long Video with Remotion
        run: |
          npx remotion render DevotionalComposition out/final_video.mp4 --props=public/props.json --concurrency=2

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devotional-video-${{ github.run_id }}
          path: out/final_video.mp4
          retention-days: 14

  # ---------------------------------------------------------------
  # JOB 3: Render Shorts Video (9:16)
  # ---------------------------------------------------------------
  render-shorts:
    needs: generate-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Install Node.js Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Install System Dependencies (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva

      - name: Download generated assets
        uses: actions/download-artifact@v4
        with:
          name: generated-assets-${{ github.run_id }}

      - name: Render Shorts Video with Remotion
        run: |
          npx remotion render DevotionalShortsComposition out/final_video_shorts.mp4 --props=public/props_shorts.json --concurrency=2

      - name: Upload Shorts Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devotional-shorts-${{ github.run_id }}
          path: out/final_video_shorts.mp4
          retention-days: 14

  # ---------------------------------------------------------------
  # JOB 4: Create GitHub Release and Notify Make.com
  # ---------------------------------------------------------------
  publish-and-notify:
    needs: [generate-assets, render-long, render-shorts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated assets (thumbnail + metadata)
        uses: actions/download-artifact@v4
        with:
          name: generated-assets-${{ github.run_id }}
          path: assets

      - name: Download long video
        uses: actions/download-artifact@v4
        with:
          name: devotional-video-${{ github.run_id }}
          path: video

      - name: Download shorts video
        uses: actions/download-artifact@v4
        with:
          name: devotional-shorts-${{ github.run_id }}
          path: shorts

      - name: Create GitHub Release with video + thumbnail assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="devotional-${{ github.run_id }}"
          gh release create "$TAG" \
            "video/final_video.mp4" \
            "shorts/final_video_shorts.mp4" \
            "assets/out/thumbnail.jpg" \
            --repo "${{ github.repository }}" \
            --title "Devotional upload $TAG" \
            --notes "Automated release for Make.com YouTube upload webhook."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Look up public download URLs for the release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.release.outputs.tag }}"
          JSON=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")
          echo "long_url=$(echo "$JSON" | jq -r '.assets[] | select(.name=="final_video.mp4") | .browser_download_url')" >> "$GITHUB_OUTPUT"
          echo "shorts_url=$(echo "$JSON" | jq -r '.assets[] | select(.name=="final_video_shorts.mp4") | .browser_download_url')" >> "$GITHUB_OUTPUT"
          echo "thumb_url=$(echo "$JSON" | jq -r '.assets[] | select(.name=="thumbnail.jpg") | .browser_download_url')" >> "$GITHUB_OUTPUT"

      - name: Notify Make.com (uploads long video + Shorts to YouTube)
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_YOUTUBE_WEBHOOK_URL }}
        run: |
          set -e
          jq -n \
            --arg releaseTag "${{ steps.release.outputs.tag }}" \
            --arg longUrl "${{ steps.assets.outputs.long_url }}" \
            --arg shortsUrl "${{ steps.assets.outputs.shorts_url }}" \
            --arg thumbUrl "${{ steps.assets.outputs.thumb_url }}" \
            --slurpfile meta "assets/out/metadata.json" \
            '{
              releaseTag: $releaseTag,
              long_video: {
                downloadUrl: $longUrl,
                title: $meta[0].long_video_title,
                description: $meta[0].long_video_description,
                tags: $meta[0].tags
              },
              shorts: {
                downloadUrl: $shortsUrl,
                title: $meta[0].shorts_title,
                description: $meta[0].shorts_description,
                tags: $meta[0].hashtags
              },
              thumbnail: {
                downloadUrl: $thumbUrl
              }
            }' > payload.json
          curl -sS -f -X POST -H "Content-Type: application/json" \
            --data @payload.json "$MAKE_WEBHOOK_URL"
