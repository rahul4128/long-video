name: Render Devotional Video (Long + Shorts)

on:
  repository_dispatch:
    types: [trigger-render-long]
  workflow_dispatch:
    inputs:
      payload:
        description: 'Make.com render payload JSON (not required when reusing a prior cached GitHub run)'
        required: false
        type: string
      story_file:
        description: 'Optional JSON filename in data/replay_stories (no 10k-character paste needed)'
        required: false
        type: string
      reuse_run_id:
        description: 'GitHub run ID with an approved-story-<run_id> artifact (reuse last script without Make/Gemini)'
        required: false
        type: string
      use_canva_images:
        description: 'Use Canva AI for all narration-specific images when needed (consumes user AI credits)'
        required: false
        type: boolean
        default: true
      canva_smoke_only:
        description: 'Test exactly one Canva image (no rendering, no publishing)'
        required: false
        type: boolean
        default: false
      gemini_tts_smoke_only:
        description: 'Generate one short Hindi Gemini voice MP3 (no rendering or publishing)'
        required: false
        type: boolean
        default: false
      canva_image_max_per_run:
        description: 'Max Canva AI images this run (default 80, 1-200; actual Canva quota applies)'
        required: false
        type: string
        default: '80'
      tts_engine:
        description: 'Narrator: gemini (Gemini->Kokoro->Edge), kokoro, edge or indicf5'
        required: false
        type: string
        default: 'gemini'
      preflight_only:
        description: 'Run Python regression checks and cache story only, without TTS/images/render'
        required: false
        type: boolean
        default: false
      pipeline:
        description: 'Pipeline label'
        required: false
        default: 'canva-updated-flow'
        type: string
      qc_verdict:
        description: 'Agent QC verdict'
        required: false
        type: string
      agent_critique:
        description: 'Agent critique'
        required: false
        type: string
      scout_note:
        description: 'Live scout note'
        required: false
        type: string
      privacy:
        description: 'YouTube privacy for this run: public, unlisted or private (use private/unlisted when you want to polish in Canva first)'
        required: false
        type: string
      review_approved:
        description: 'Explicit human approval to publish the release and notify YouTube (defaults to review-only draft)'
        required: false
        type: boolean
        default: false
      publish_date_ist:
        description: 'Optional planned publication date YYYY-MM-DD (Asia/Kolkata); defaults to actual render day'
        required: false
        type: string

concurrency:
  group: canva-token-rotation
  cancel-in-progress: false

jobs:
  # CACHE FIRST. This preflight stage spends no Gemini/stock/TTS tokens and
  # saves the approved Make script before even the cheapest regression tests.
  # Rerun with reuse_run_id on the latest branch instead of re-running Make.
  preflight:
    if: ${{ !inputs.canva_smoke_only && !inputs.gemini_tts_smoke_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      pipeline: ${{ steps.store.outputs.pipeline }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7

      - name: Restore previously approved episode from GitHub artifacts
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$ORIGINAL_RUN" =~ ^[0-9]{4,20}$ ]]; then
            echo "::error::reuse_run_id must be a numeric GitHub Actions run ID"
            exit 1
          fi
          mkdir -p out/reused
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "approved-story-$ORIGINAL_RUN" --dir out/reused || {
              echo "::error::No cached story for that old run. Export Make module 3/5 full JSON and submit it once as the payload input."
              exit 1
            }

      - name: Verify and cache approved episode inputs for low-cost retries
        if: ${{ !inputs.preflight_only || inputs.payload != '' || inputs.story_file != '' || inputs.reuse_run_id != '' }}
        id: store
        env:
          NEW_DISPATCH_PAYLOAD: ${{ inputs.payload || toJson(github.event.client_payload) }}
          NEW_PIPELINE: ${{ inputs.pipeline || 'canva-updated-flow' }}
          REPLAY_RUN_ID: ${{ inputs.reuse_run_id || '' }}
          STORY_FILE: ${{ inputs.story_file || '' }}
          REVIEW_APPROVED: ${{ inputs.review_approved || 'false' }}
          PUBLICATION_DATE_IST: ${{ inputs.publish_date_ist || '' }}
        run: python -m scripts.preflight_payload

      - name: Store approved story before running tests or generating paid media
        if: ${{ !inputs.preflight_only || inputs.payload != '' || inputs.story_file != '' || inputs.reuse_run_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: approved-story-${{ github.run_id }}
          path: out/replay_inputs.json
          if-no-files-found: error
          retention-days: 14

      # An LLM PASS is not festival-date evidence. Reject contradicted 'today',
      # 'tomorrow', 'after', or last-day claims BEFORE any image/TTS credits.
      # The original story is cached above even when this check rejects it.
      - name: Verify festival-relative dates before paid media generation
        if: ${{ !inputs.preflight_only || inputs.payload != '' || inputs.story_file != '' || inputs.reuse_run_id != '' }}
        env:
          TARGET_PUBLISH_DATE_IST: ${{ inputs.publish_date_ist || '' }}
        run: python -m scripts.validate_festival_timing --replay out/replay_inputs.json

      - name: Save independent festival-date QC report for review
        if: ${{ always() && (!inputs.preflight_only || inputs.payload != '' || inputs.story_file != '' || inputs.reuse_run_id != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: festival-date-qc-${{ github.run_id }}
          path: out/festival_date_qc.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Set up Python for inexpensive regression checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -r requirements.txt pynacl

      - name: Type-check Remotion scenes and motion graphics (no video render)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify React/Remotion TypeScript compiles
        run: |
          # Story/media JSON is normally generated later by Python. Stubs
          # are used ONLY for type checking; no render uses these assets.
          mkdir -p public
          test -f public/props_shorts.json || cp public/props.json public/props_shorts.json
          test -f public/thumbnail_props.json || printf '%s\n' '{"backgroundImage":"placeholder.jpg","hookText":"परीक्षण"}' > public/thumbnail_props.json
          test -f public/thumbnail_props_shorts.json || printf '%s\n' '{"backgroundImage":"placeholder.jpg","hookText":"परीक्षण"}' > public/thumbnail_props_shorts.json
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Run ALL asset/editing/sound regressions before media generation
        run: |
          set -euo pipefail
          for name in \
            test_image_framing.py test_canva_image_provider.py test_canva_token_handoff.py test_gemini_tts.py test_episode_voice.py test_instagram_release_caption.py test_music_engine.py test_editing_director.py test_story_driven_edit.py test_canva_style_editor.py \
            test_story_visual_relevance.py \
            test_p1_storytelling.py test_preflight_payload.py test_festival_date_gate.py test_festival_timing.py test_editing_performance_learning.py \
            test_render_style_feedback.py test_editing_style_engine.py \
            test_verified_edit_skills.py test_color_continuity.py \
            test_master_final_audio.py test_validate_final_audio.py; do
            python -m unittest discover -s tests -p "$name" -v
          done

  # Safe manual test: one Gemini API call, no Make dispatch, video or publishing.
  gemini-tts-smoke:
    if: ${{ inputs.gemini_tts_smoke_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install narration smoke dependencies
        run: |
          python -m pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Generate a single Hindi sample using Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Kore' }}
          GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE || '' }}
        run: python -m scripts.gemini_tts_smoke
      - name: Save sample MP3 for listening
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gemini-hindi-voice-${{ github.run_id }}
          path: out/gemini_tts_smoke.mp3
          if-no-files-found: warn
          retention-days: 7

  # One-credit manual Canva test using the EXISTING registered render workflow.
  # workflow_dispatch registration requires the workflow to exist on the
  # default branch; this job is reachable through the existing render.yml.
  canva-image-smoke:
    if: ${{ inputs.canva_smoke_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python for Canva image smoke
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install smoke dependencies (including FFprobe for image QC)
        run: |
          pip install requests "Pillow>=10,<12" pynacl
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          command -v ffprobe
          command -v ffmpeg
      - name: Authenticate Canva for one image and rotate refresh token
        env:
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          REPO_SECRETS_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/refresh_canva_token.py
      - name: Generate one Canva image and validate framing
        run: python -m scripts.canva_image_smoke
      - name: Save test image for visual review even if QC fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canva-smoke-image-${{ github.run_id }}
          path: out/canva_smoke_scene.jpg
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------
  # JOB 1: Generate all assets (images/video clips, narration audio,
  # sound effects, thumbnail). Python-only - no Node.js needed here,
  # so this job no longer wastes time installing Node/npm at all.
  # ---------------------------------------------------------------
  generate-assets:
    needs: preflight
    if: ${{ !inputs.preflight_only }}
    runs-on: ubuntu-latest
    # Own-voice IndicF5 on a CPU runner is slow; keep a generous ceiling.
    timeout-minutes: 90
    # Needed so the "Persist clip-usage history" step below can push
    # used_clips_history.json back to the repo (see generate_assets.py's
    # clip-usage-history section for why this file exists).
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load the cached approved story (never rerun Gemini)
        uses: actions/download-artifact@v7
        with:
          name: approved-story-${{ github.run_id }}
          path: out

      - name: Static Python syntax check
        run: python -m py_compile scripts/validate_festival_timing.py scripts/canva_token_handoff.py scripts/gemini_tts.py scripts/canva_image_provider.py content_qc.py visual_qc.py director.py generate_assets.py audio_engine.py qc.py hindi_text.py clip_rerank.py indicf5_engine.py scripts/canva_asset_bridge.py scripts/youtube_pack.py scripts/validate_native_visuals.py scripts/image_framing.py music_engine.py scripts/validate_music.py editing_director.py scripts/validate_editing.py editing_style_engine.py color_continuity.py scripts/validate_color_continuity.py scripts/master_final_audio.py scripts/validate_final_audio.py spoken_hindi_qc.py scripts/visual_relevance_gate.py scripts/visual_storyboard.py scripts/build_editing_style_signals.py scripts/render_style_attribution.py scripts/ingest_editing_feedback.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      # Model weights for the optional engines (IndicF5 own voice, OpenCLIP)
      # are downloaded once and then restored from cache on later runs.
      - name: Cache model weights (optional engines)
        if: ${{ (inputs.tts_engine || 'gemini') == 'indicf5' || (inputs.tts_engine || 'gemini') == 'kokoro' || (inputs.tts_engine || 'gemini') == 'gemini' || (vars.CLIP_RERANK_ENABLED || 'true') == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: models-${{ inputs.tts_engine || 'gemini' }}-${{ vars.CLIP_RERANK_ENABLED || 'true' }}-v1

      # Caches the downloaded .deb files, keyed on the package list below.
      # Only re-downloads from the network if you change the package list
      # (i.e. edit the "key" or the packages themselves) - otherwise this
      # step restores from cache and apt-get skips the network fetch.
      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      # Refresh Canva OAuth in the same job that generates scene images.
      # Do not expose the rotating refresh token to logs. Explicit opt-in only.
      - name: Install Canva OAuth dependency for image fallback
        if: ${{ github.event_name == 'repository_dispatch' || inputs.use_canva_images || vars.CANVA_IMAGE_FALLBACK_ENABLED == 'true' }}
        run: pip install pynacl

      - name: Authenticate Canva for image fallback and rotate refresh token
        if: ${{ github.event_name == 'repository_dispatch' || inputs.use_canva_images || vars.CANVA_IMAGE_FALLBACK_ENABLED == 'true' }}
        continue-on-error: true
        env:
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          REPO_SECRETS_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANVA_TOKEN_TRANSFER_FILE: out/canva-token.enc
        run: python scripts/refresh_canva_token.py

      - name: Save encrypted Canva access-token handoff for this run only
        if: ${{ github.event_name == 'repository_dispatch' || inputs.use_canva_images || vars.CANVA_IMAGE_FALLBACK_ENABLED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: canva-access-encrypted-${{ github.run_id }}
          path: out/canva-token.enc
          if-no-files-found: ignore
          retention-days: 1

      # Optional engines - installed only when switched on with repo
      # variables, so the default (Edge voice) run stays fast.
      - name: Install optional engines (own voice / Kokoro / CLIP)
        if: ${{ (inputs.tts_engine || 'gemini') == 'indicf5' || (inputs.tts_engine || 'gemini') == 'kokoro' || (inputs.tts_engine || 'gemini') == 'gemini' || (vars.CLIP_RERANK_ENABLED || 'true') == 'true' }}
        run: |
          # Keep torch + torchvision + torchaudio on the SAME CPU wheel index.
          # Previously torchvision arrived transitively from PyPI, causing
          # "operator torchvision::nms does not exist" at OpenCLIP import time.
          pip install --upgrade torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          if [ "${{ inputs.tts_engine || 'gemini' }}" = "indicf5" ]; then pip install -r requirements-indicf5.txt; pip uninstall -y torchcodec || true; fi
          if [ "${{ inputs.tts_engine || 'gemini' }}" = "kokoro" ] || [ "${{ inputs.tts_engine || 'gemini' }}" = "gemini" ]; then pip install -r requirements-kokoro.txt; fi
          if [ "${{ vars.CLIP_RERANK_ENABLED || 'true' }}" = "true" ]; then
            pip install -r requirements-clip.txt
            python -c "import torch, torchvision, open_clip; from torchvision.ops import nms; print('OpenCLIP runtime ready: torch=' + torch.__version__ + ', torchvision=' + torchvision.__version__)"
          fi

      - name: Generate Unified Assets (4K B-Roll + FLUX.1 + Voiceover)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Kore' }}
          GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE || '' }}
          GEMINI_TTS_MAX_REQUESTS: ${{ vars.GEMINI_TTS_MAX_REQUESTS || '12' }}
          GEMINI_TTS_DAILY_REMAINING: ${{ vars.GEMINI_TTS_DAILY_REMAINING || '' }}
          GEMINI_TTS_MAX_API_ATTEMPTS: ${{ vars.GEMINI_TTS_MAX_API_ATTEMPTS || '18' }}
          GEMINI_TTS_MAX_RETRIES: ${{ vars.GEMINI_TTS_MAX_RETRIES || '2' }}
          GEMINI_TTS_COOLDOWN_SECONDS: ${{ vars.GEMINI_TTS_COOLDOWN_SECONDS || '20' }}
          GEMINI_TTS_MIN_GAP_SECONDS: ${{ vars.GEMINI_TTS_MIN_GAP_SECONDS || '6' }}
          CANVA_IMAGE_FALLBACK_ENABLED: ${{ (github.event_name == 'repository_dispatch' || inputs.use_canva_images || vars.CANVA_IMAGE_FALLBACK_ENABLED == 'true') && 'true' || 'false' }}
          CANVA_IMAGE_MAX_PER_RUN: ${{ inputs.canva_image_max_per_run || vars.CANVA_IMAGE_MAX_PER_RUN || '80' }}
          CANVA_IMAGE_MIN_GAP_SECONDS: ${{ vars.CANVA_IMAGE_MIN_GAP_SECONDS || '5' }}
          CANVA_IMAGE_MAX_RETRIES: ${{ vars.CANVA_IMAGE_MAX_RETRIES || '2' }}
          CANVA_IMAGE_MAX_COOLDOWN_SECONDS: ${{ vars.CANVA_IMAGE_MAX_COOLDOWN_SECONDS || '120' }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
          AUDIO_TTS_ENGINE: ${{ inputs.tts_engine || 'gemini' }}
          # true = stop the run if the own voice (IndicF5) fails, instead of
          # silently narrating with Edge-TTS. Set repo variable INDICF5_STRICT.
          INDICF5_STRICT: ${{ vars.INDICF5_STRICT || 'false' }}
          CLIP_RERANK_ENABLED: ${{ vars.CLIP_RERANK_ENABLED || 'true' }}
          HOOK_OVERLAY_ENABLED: ${{ vars.HOOK_OVERLAY_ENABLED || 'true' }}
          EDITORIAL_EDITING_ENABLED: ${{ vars.EDITORIAL_EDITING_ENABLED || 'true' }}
          # Creator requested NO burned-in narration captions or repeat text cards.
          # Audio word timings remain available for beat-synced cuts and SFX.
          SUBTITLES_ENABLED: 'false'
          EDITORIAL_TEXT_OVERLAYS_ENABLED: 'false'
          COLOR_MATCH_ENABLED: ${{ vars.COLOR_MATCH_ENABLED || 'true' }}
          SPOKEN_HINDI_STRICT: ${{ vars.SPOKEN_HINDI_STRICT || 'false' }}
          EDITING_METRICS_SCOPE: ${{ needs.preflight.outputs.pipeline }}
        run: |
          export DISPATCH_PAYLOAD="$(python -c 'import json; print(json.load(open("out/replay_inputs.json", encoding="utf-8"))["payload"])')"
          python generate_assets.py

      - name: Verify per-segment Gemini-first narration report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("out/voice_episode_report.json").read_text())
          assert report["status"] == "passed"
          assert report["mode"] == "per_segment_gemini_first"
          assert len(report["chunks"]) == report["chunk_count"] > 0
          assert all(item["engine"] in ("gemini", "kokoro", "edge", "indicf5")
                     for item in report["chunks"])
          print("Narrators per segment:", report["counts"])
          PY

      # Audit exactly what the editor chose before costly Remotion rendering.
      - name: Build storyboard contact sheets matched to Hindi narration
        if: always()
        continue-on-error: true
        run: python scripts/visual_storyboard.py

      - name: Fail closed if Long or Shorts scene visuals are missing
        run: python scripts/validate_native_visuals.py

      - name: Validate music files, copyright evidence and scene coverage
        run: python scripts/validate_music.py

      - name: Validate narration-led editing rhythm and subtitle-free composition
        run: python scripts/validate_editing.py

      - name: Validate sampled color and continuity plan
        run: python scripts/validate_color_continuity.py

      # Any failure in generation OR final validation must retain the actual
      # narration and already-selected media. Earlier checkpoint placement
      # happened before validate_native_visuals.py, so run 166 lost every
      # generated source file when its final relevance check failed.
      # A checkpoint remains review-only and MUST NOT bypass QC.
      - name: Preserve unfinished media on any asset or validation failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: partial-assets-${{ github.run_id }}
          path: |
            public/images
            public/audio
            public/props.json
            public/props_shorts.json
            out/metadata.json
            out/visual_qc_report.json
            out/visual_story_alignment_report.json
            out/visual_search_report.json
            out/visual_storyboard_*.jpg
            out/visual_storyboard_*.json
            out/partial_props_*.json
            out/spoken_hindi_report.json
            out/voice_episode_report.json
          if-no-files-found: warn
          retention-days: 2

      - name: Upload content QC report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: content-qc-${{ github.run_id }}
          path: out/content_qc_report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual director diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diagnostics-${{ github.run_id }}
          path: |
            out/visual_director_plan.json
            out/visual_search_report.json
            out/visual_story_alignment_report.json
            out/visual_storyboard_*.json
            out/visual_storyboard_*.jpg
            out/partial_props_*.json
            out/visual_qc_report.json
            out/editing_qc_report.json
            out/color_continuity_report.json
            out/spoken_hindi_report.json
          if-no-files-found: ignore
          retention-days: 7

      # Commits used_clips_history.json (written by generate_assets.py's
      # save_clip_history()) back to the repo, so a LATER run can see which
      # stock clips this run used and avoid repeating them (this is what
      # actually fixes "same clip in two videos" - the history has to
      # survive between separate workflow runs, and each run gets a fresh
      # ephemeral runner, so persisting it in the repo is the simplest place
      # that's already writable via this job's GITHUB_TOKEN). Uses
      # pull --rebase before pushing since another run could theoretically
      # be committing at the same time; if the push still loses a race this
      # step logs it and moves on rather than failing the whole render.
      - name: Persist clip-usage history (avoid repeating recent clips)
        if: ${{ always() }}
        run: |
          if [ ! -f used_clips_history.json ]; then
            echo "No used_clips_history.json produced (no stock clips fetched this run) - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_clips_history.json
          if git diff --cached --quiet; then
            echo "No change to used_clips_history.json - nothing to commit."
            exit 0
          fi
          git commit -m "Update clip-usage history (run ${{ github.run_id }})"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then
              echo "Pushed clip-usage history update."
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "::warning::Could not push used_clips_history.json after 3 attempts (non-fatal - dedup just won't see this run's clips next time)."

      # Hand the generated files off to the two render jobs below. Short
      # retention since this is only needed for the rest of this one run.
      - name: Upload generated assets
        uses: actions/upload-artifact@v7
        with:
          name: generated-assets-${{ github.run_id }}
          path: |
            public/images
            public/audio
            public/props.json
            public/props_shorts.json
            public/thumbnail_props*.json
            out/thumbnail.jpg
            out/thumbnail_shorts.jpg
            out/metadata.json
            out/content_qc_report.json
            out/visual_director_plan.json
            out/visual_search_report.json
            out/visual_story_alignment_report.json
            out/visual_storyboard_*.json
            out/visual_storyboard_*.jpg
            out/partial_props_*.json
            out/visual_qc_report.json
            out/canva_assets.json
            out/music_license_report.json
            out/editing_qc_report.json
            out/color_continuity_report.json
            out/spoken_hindi_report.json
            out/voice_episode_report.json
          retention-days: 1

  # ---------------------------------------------------------------
  # JOB 2 & JOB 3: Render the long video and the shorts video.
  # Both only depend on generate-assets, NOT on each other, so GitHub
  # runs them on two separate runners AT THE SAME TIME instead of one
  # after another - this is the main speed win for render time.
  # ---------------------------------------------------------------
  render-long:
    needs: generate-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Skips "npm install" completely on a cache hit - only reinstalls
      # when package.json / package-lock.json actually change.
      # node_modules (incl. Remotion's headless Chrome) is restored from
      # cache; npm install only runs when package.json changes.
      - name: Cache node_modules
        id: nodecache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}-v1

      - name: Install Node.js Dependencies
        if: steps.nodecache.outputs.cache-hit != 'true'
        run: npm install

      - name: Install System Dependencies (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva

      - name: Download generated assets
        uses: actions/download-artifact@v7
        with:
          name: generated-assets-${{ github.run_id }}

      - name: Render Long Video with Remotion
        run: |
          START_TS=$(date +%s)
          npx remotion render DevotionalComposition out/final_video.mp4 \
            --props=public/props.json \
            --concurrency=$(nproc) \
            --codec=h264 \
            --crf=21 \
            --offthreadvideo-video-threads=2
          END_TS=$(date +%s)
          ELAPSED=$((END_TS-START_TS))
          SIZE_BYTES=$(stat -c%s out/final_video.mp4)
          echo "### Long render benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seconds: $ELAPSED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size bytes: $SIZE_BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "- Composition FPS: 24" >> "$GITHUB_STEP_SUMMARY"
          echo "LONG_RENDER_SECONDS=$ELAPSED" >> "$GITHUB_ENV"

      - name: Master and verify final Long audio mix
        run: |
          python scripts/master_final_audio.py --input out/final_video.mp4 \
            --output out/final_video.mastered.mp4 --report out/audio_master_long.json
          mv -f out/final_video.mastered.mp4 out/final_video.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v7
        with:
          name: devotional-video-${{ github.run_id }}
          path: |
            out/final_video.mp4
            out/audio_master_long.json
          retention-days: 14

  render-shorts:
    needs: generate-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # node_modules (incl. Remotion's headless Chrome) is restored from
      # cache; npm install only runs when package.json changes.
      - name: Cache node_modules
        id: nodecache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}-v1

      - name: Install Node.js Dependencies
        if: steps.nodecache.outputs.cache-hit != 'true'
        run: npm install

      - name: Install System Dependencies (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva

      - name: Download generated assets
        uses: actions/download-artifact@v7
        with:
          name: generated-assets-${{ github.run_id }}

      - name: Render Shorts Video with Remotion
        run: |
          npx remotion render DevotionalShortsComposition out/final_video_shorts.mp4 --props=public/props_shorts.json --concurrency=$(nproc)

      - name: Master and verify final Shorts audio mix
        run: |
          python scripts/master_final_audio.py --input out/final_video_shorts.mp4 \
            --output out/final_video_shorts.mastered.mp4 --report out/audio_master_shorts.json
          mv -f out/final_video_shorts.mastered.mp4 out/final_video_shorts.mp4

      - name: Upload Shorts Video Artifact
        uses: actions/upload-artifact@v7
        with:
          name: devotional-shorts-${{ github.run_id }}
          path: |
            out/final_video_shorts.mp4
            out/audio_master_shorts.json
          retention-days: 14

  # ---------------------------------------------------------------
  # JOB 4: Render the final thumbnail - the plain AI background image
  # (already produced by generate-assets) with a bold Hindi hook-text
  # overlay, rendered through Remotion/Chromium via `npx remotion still`
  # so Devanagari script shapes correctly (this is the same rendering
  # pipeline that already renders Subtitles.tsx's captions correctly -
  # a plain image-editing text overlay risks garbled conjuncts/matras).
  # Only depends on generate-assets, so it runs in parallel with the two
  # video render jobs above rather than adding to the critical path.
  # ---------------------------------------------------------------
  render-thumbnail:
    needs: generate-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # node_modules (incl. Remotion's headless Chrome) is restored from
      # cache; npm install only runs when package.json changes.
      - name: Cache node_modules
        id: nodecache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}-v1

      - name: Install Node.js Dependencies
        if: steps.nodecache.outputs.cache-hit != 'true'
        run: npm install

      - name: Install System Dependencies (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva

      - name: Download generated assets
        uses: actions/download-artifact@v7
        with:
          name: generated-assets-${{ github.run_id }}

      - name: Render Thumbnail (background image + bold Hindi hook-text overlay)
        run: |
          npx remotion still ThumbnailComposition out/thumbnail.jpg --props=public/thumbnail_props.json

      - name: Upload Thumbnail Artifact
        uses: actions/upload-artifact@v7
        with:
          name: devotional-thumbnail-${{ github.run_id }}
          path: out/thumbnail.jpg
          retention-days: 1

  # ---------------------------------------------------------------
  # JOB 4b: Same idea as JOB 4, but for the Shorts-specific 9:16
  # thumbnail (its own background image + hook text - see
  # ShortsThumbnailComposition.tsx / generate_assets.py's
  # `shorts_thumbnail` handling). Previously Shorts had no dedicated
  # thumbnail render at all. Runs in parallel with everything else.
  # ---------------------------------------------------------------
  render-thumbnail-shorts:
    needs: generate-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # node_modules (incl. Remotion's headless Chrome) is restored from
      # cache; npm install only runs when package.json changes.
      - name: Cache node_modules
        id: nodecache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}-v1

      - name: Install Node.js Dependencies
        if: steps.nodecache.outputs.cache-hit != 'true'
        run: npm install

      - name: Install System Dependencies (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-deva

      - name: Download generated assets
        uses: actions/download-artifact@v7
        with:
          name: generated-assets-${{ github.run_id }}

      - name: Render Shorts Thumbnail (background image + bold Hindi hook-text overlay)
        run: |
          npx remotion still ShortsThumbnailComposition out/thumbnail_shorts_final.jpg --props=public/thumbnail_props_shorts.json

      - name: Upload Shorts Thumbnail Artifact
        uses: actions/upload-artifact@v7
        with:
          name: devotional-thumbnail-shorts-${{ github.run_id }}
          path: out/thumbnail_shorts_final.jpg
          retention-days: 1

  # ---------------------------------------------------------------
  # JOB 4c: Automated media QC. Verifies final videos, thumbnails and every
  # generated narration/effect file with ffprobe before publishing.
  # ---------------------------------------------------------------
  media-qc:
    needs: [generate-assets, render-long, render-shorts, render-thumbnail, render-thumbnail-shorts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Download generated assets
        uses: actions/download-artifact@v7
        with:
          name: generated-assets-${{ github.run_id }}
      - name: Download long video
        uses: actions/download-artifact@v7
        with:
          name: devotional-video-${{ github.run_id }}
          path: out
      - name: Download shorts video
        uses: actions/download-artifact@v7
        with:
          name: devotional-shorts-${{ github.run_id }}
          path: out
      - name: Download long thumbnail
        uses: actions/download-artifact@v7
        with:
          name: devotional-thumbnail-${{ github.run_id }}
          path: out
      - name: Download shorts thumbnail
        uses: actions/download-artifact@v7
        with:
          name: devotional-thumbnail-shorts-${{ github.run_id }}
          path: out
      - name: Verify both mastered audio tracks from final artifacts
        run: python scripts/validate_final_audio.py

      - name: Run automated media QC
        run: python qc.py
      - name: Upload QC report
        uses: actions/upload-artifact@v7
        with:
          name: media-qc-${{ github.run_id }}
          path: out/qc_report.json
          retention-days: 14

  # ---------------------------------------------------------------
  # JOB 5: Once both video renders and both thumbnail renders are done,
  # publish a GitHub Release carrying the long video, the shorts video
  # and both text-overlaid thumbnails as public, no-auth-required
  # download links, then notify the Make.com scenario (one webhook
  # call, handles both videos) so it uploads both to YouTube with
  # title/description/thumbnail and files each into its playlist.
  # ---------------------------------------------------------------
  publish-and-notify:
    needs: [preflight, generate-assets, render-long, render-shorts, render-thumbnail, render-thumbnail-shorts, media-qc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download generated assets (metadata)
        uses: actions/download-artifact@v7
        with:
          name: generated-assets-${{ github.run_id }}
          path: assets

      - name: Download long video
        uses: actions/download-artifact@v7
        with:
          name: devotional-video-${{ github.run_id }}
          path: video

      - name: Download shorts video
        uses: actions/download-artifact@v7
        with:
          name: devotional-shorts-${{ github.run_id }}
          path: shorts

      - name: Download rendered thumbnail (with hook-text overlay)
        uses: actions/download-artifact@v7
        with:
          name: devotional-thumbnail-${{ github.run_id }}
          path: thumbnail_final

      - name: Download rendered Shorts thumbnail (with hook-text overlay)
        uses: actions/download-artifact@v7
        with:
          name: devotional-thumbnail-shorts-${{ github.run_id }}
          path: thumbnail_shorts_final

      # Only successful QC-passed renders can become editing-style evidence.
      # The attribution ledger is NOT proof of YouTube upload. Feedback still
      # requires exact Youtube video IDs / titles and mature analytics.
      - name: Persist actual editing style after both final MP4s pass QC
        env:
          ATTRIBUTION_PIPELINE: ${{ needs.preflight.outputs.pipeline }}
          GITHUB_RENDER_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          python scripts/render_style_attribution.py \
            --metadata assets/out/metadata.json \
            --editing assets/out/editing_qc_report.json \
            --pipeline "$ATTRIBUTION_PIPELINE" \
            --run-id "$GITHUB_RENDER_ID"
          git add data/render_editing_history.json
          if git diff --cached --quiet; then
            echo "No new attributable video render to persist."
          else
            git commit -m "Record approved-QC editing style (render $GITHUB_RENDER_ID)"
            saved=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then
                saved=true
                break
              fi
              sleep 4
            done
            if [ "$saved" != "true" ]; then
              echo "::warning::Render was QC-passed but style attribution could not be persisted. This run will not contribute to editing learning."
            fi
          fi

      # -----------------------------------------------------------
      # Canva finishing: runs on the FINAL rendered files. Uploads both
      # videos + both thumbnails to Canva and creates ready-to-edit
      # thumbnail designs; links go into the release notes. Every Canva
      # problem is a warning only - it can never block publishing.
      # -----------------------------------------------------------
      - name: Set up Python for Canva finishing
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Canva dependencies
        run: pip install requests pynacl

      # Repository secrets are snapshotted when the workflow starts.
      # An earlier asset job may have used & rotated Canva's single-use
      # refresh token, so never refresh the same snapshot again here.
      - name: Download encrypted Canva access-token from asset generation
        if: ${{ github.event_name == 'repository_dispatch' || inputs.use_canva_images || vars.CANVA_IMAGE_FALLBACK_ENABLED == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: canva-access-encrypted-${{ github.run_id }}
          path: out

      - name: Reuse Canva access token without consuming refresh token twice
        if: ${{ github.event_name == 'repository_dispatch' || inputs.use_canva_images || vars.CANVA_IMAGE_FALLBACK_ENABLED == 'true' }}
        continue-on-error: true
        env:
          REPO_SECRETS_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
          CANVA_TOKEN_TRANSFER_FILE: out/canva-token.enc
        run: python scripts/canva_token_handoff.py

      - name: Authenticate Canva for finishing only (no prior image OAuth)
        if: ${{ github.event_name != 'repository_dispatch' && !inputs.use_canva_images && vars.CANVA_IMAGE_FALLBACK_ENABLED != 'true' }}
        continue-on-error: true
        env:
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          REPO_SECRETS_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/refresh_canva_token.py

      - name: Canva finishing (upload final videos + thumbnails, create editable designs)
        continue-on-error: true
        env:
          CANVA_ASSET_BRIDGE_ENABLED: ${{ vars.CANVA_FINISHING_ENABLED || 'true' }}
          CANVA_UPLOAD_VIDEOS: ${{ vars.CANVA_UPLOAD_VIDEOS || 'true' }}
          CANVA_UPLOAD_SCENE_ASSETS: ${{ vars.CANVA_UPLOAD_SCENE_ASSETS || 'true' }}
          CANVA_SCENE_ASSET_DIR: assets/public/images
          CANVA_METADATA_JSON: assets/out/metadata.json
          CANVA_THUMB_PATH: thumbnail_final/thumbnail.jpg
          CANVA_SHORTS_THUMB_PATH: thumbnail_shorts_final/thumbnail_shorts_final.jpg
          CANVA_LONG_VIDEO_PATH: video/final_video.mp4
          CANVA_SHORTS_VIDEO_PATH: shorts/final_video_shorts.mp4
        run: |
          python scripts/canva_asset_bridge.py
          cat out/canva_notes.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build copy-paste YouTube upload pack
        env:
          PACK_METADATA_JSON: assets/out/metadata.json
          PACK_OUTPUT: out/youtube_pack.md
        run: |
          python scripts/youtube_pack.py
          cat out/youtube_pack.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Create review-only draft release with video + thumbnail assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_APPROVED: ${{ inputs.review_approved || 'false' }}
        run: |
          set -euo pipefail
          TAG="devotional-${{ github.run_id }}"
          # Draft releases are not reliably accessible through the tag lookup API.
          # Reuse an existing release on job retry instead of deleting its assets.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_FLAGS=(--draft)
            if [ "$REVIEW_APPROVED" = "true" ]; then
              RELEASE_FLAGS=()
            fi
            {
              cat out/youtube_pack.md 2>/dev/null || echo "_YouTube pack not generated._"
              echo
              cat out/canva_notes.md 2>/dev/null || echo "_Canva finishing not run._"
            } > release_notes.md
            gh release create "$TAG" \
              "video/final_video.mp4" \
              "shorts/final_video_shorts.mp4" \
              "thumbnail_final/thumbnail.jpg" \
              "thumbnail_shorts_final/thumbnail_shorts_final.jpg" \
              "assets/out/music_license_report.json" \
              "assets/out/editing_qc_report.json" \
              "assets/out/color_continuity_report.json" \
              "assets/out/spoken_hindi_report.json" \
              "video/audio_master_long.json" \
              "shorts/audio_master_shorts.json" \
              --repo "${{ github.repository }}" \
              --title "Devotional upload $TAG" \
              "${RELEASE_FLAGS[@]}" \
              --notes-file release_notes.md
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          else
            echo "Reusing existing release ID $RELEASE_ID for $TAG"
          fi
          test -n "$RELEASE_ID"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Look up asset URLs (draft releases are not publicly downloadable)
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JSON=$(gh api "repos/${{ github.repository }}/releases/${{ steps.release.outputs.release_id }}")
          for NAME in final_video.mp4 final_video_shorts.mp4 thumbnail.jpg thumbnail_shorts_final.jpg music_license_report.json editing_qc_report.json color_continuity_report.json spoken_hindi_report.json audio_master_long.json audio_master_shorts.json; do
            echo "$JSON" | jq -e --arg name "$NAME" '.assets | any(.name == $name and .size > 0)' > /dev/null || {
              echo "::error::Missing or empty release asset: $NAME"
              exit 1
            }
          done
          echo "long_url=$(echo "$JSON" | jq -r '.assets[] | select(.name=="final_video.mp4") | .browser_download_url')" >> "$GITHUB_OUTPUT"
          echo "shorts_url=$(echo "$JSON" | jq -r '.assets[] | select(.name=="final_video_shorts.mp4") | .browser_download_url')" >> "$GITHUB_OUTPUT"
          echo "thumb_url=$(echo "$JSON" | jq -r '.assets[] | select(.name=="thumbnail.jpg") | .browser_download_url')" >> "$GITHUB_OUTPUT"
          echo "shorts_thumb_url=$(echo "$JSON" | jq -r '.assets[] | select(.name=="thumbnail_shorts_final.jpg") | .browser_download_url')" >> "$GITHUB_OUTPUT"

      # Uploads are manual: with no MAKE_YOUTUBE_WEBHOOK_URL secret this step
      # just skips. If the secret exists but the webhook is dead, it only warns -
      # it can never turn a finished run red.
      - name: Notify Make.com ONLY after explicit review approval
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.review_approved == true }}
        continue-on-error: true
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_YOUTUBE_WEBHOOK_URL }}
          # Private review by default for either Make repository_dispatch or manual tests.
          # Public upload requires a separate explicit and reviewed workflow decision.
          YOUTUBE_PRIVACY: ${{ inputs.privacy || 'private' }}
        run: |
          set -e
          if [ -z "$MAKE_WEBHOOK_URL" ]; then
            echo "::warning::MAKE_YOUTUBE_WEBHOOK_URL is not set - videos are in the GitHub Release (and Canva) but were NOT sent for YouTube upload."
            exit 0
          fi
          CANVA_JSON=$( [ -f out/canva_assets.json ] && cat out/canva_assets.json || echo '{}' )
          jq -n \
            --arg privacy "$YOUTUBE_PRIVACY" \
            --argjson canva "$CANVA_JSON" \
            --arg releaseTag "${{ steps.release.outputs.tag }}" \
            --arg longUrl "${{ steps.assets.outputs.long_url }}" \
            --arg shortsUrl "${{ steps.assets.outputs.shorts_url }}" \
            --arg thumbUrl "${{ steps.assets.outputs.thumb_url }}" \
            --arg shortsThumbUrl "${{ steps.assets.outputs.shorts_thumb_url }}" \
            --slurpfile meta "assets/out/metadata.json" \
            '{
              releaseTag: $releaseTag,
              privacyStatus: $privacy,
              canva: {
                designs: [($canva.designs // [])[] | {label, edit_url}],
                assets: [($canva.assets // [])[] | {name, assetId, type}]
              },
              long_video: {
                downloadUrl: $longUrl,
                title: $meta[0].long_video_title,
                description: (($meta[0].long_video_description // "") + "\n\n" + (($meta[0].hashtags // []) | join(" "))),
                tags: ($meta[0].tags // [])
              },
              shorts: {
                downloadUrl: $shortsUrl,
                title: $meta[0].shorts_title,
                description: (($meta[0].shorts_description // "") + "\n\n" + (($meta[0].hashtags // []) | join(" "))),
                tags: ($meta[0].tags // []),
                thumbnailUrl: $shortsThumbUrl
              },
              thumbnail: {
                downloadUrl: $thumbUrl
              }
            }' > payload.json
          curl -sS -f -X POST -H "Content-Type: application/json" \
            --data @payload.json "$MAKE_WEBHOOK_URL"